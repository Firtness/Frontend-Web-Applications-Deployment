<h2 mat-dialog-title class="dialog-title">✏️ Editar Perfil</h2>

<mat-dialog-content class="edit-profile-dialog">
    <form (ngSubmit)="save()" class="profile-form">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre</mat-label>
            <input matInput [(ngModel)]="data.firstName" name="firstName" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Apellido</mat-label>
            <input matInput [(ngModel)]="data.lastName" name="lastName" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Correo electrónico</mat-label>
            <input matInput [(ngModel)]="data.email" name="email" type="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contraseña</mat-label>
            <input matInput [(ngModel)]="data.password" name="password" type="password" required>
        </mat-form-field>

        <div class="button-group">
            <button mat-raised-button color="accent" type="submit">💾 Guardar</button>
            <button mat-raised-button type="button" (click)="close()">Cancelar</button>
        </div>
    </form>
</mat-dialog-content>
