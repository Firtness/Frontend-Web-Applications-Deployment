@if (currentUser.roles[0] === "ROLE_TEACHER") {
    <h3 style="margin-bottom: 20px;">{{ 'challenges' | translate }}</h3>
} @else {
    <h3>{{ 'yourChallenges' | translate }}</h3>
}

<mat-grid-list cols="2" rowHeight="300px">
    @for (challenge of challenges; track challenge) {
        <mat-grid-tile>
            <app-challenge-card-item [challenge]="challenge"></app-challenge-card-item>
        </mat-grid-tile>
    }
</mat-grid-list>
