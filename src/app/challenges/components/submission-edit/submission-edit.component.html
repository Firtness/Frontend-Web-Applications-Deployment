<form [formGroup]="submissionForm" (ngSubmit)="onSubmit()">

    @if (student) {
        <p>🎓 {{ 'student' | translate }}: {{ student.firstName }} {{ student.lastName }}</p>
    }

    <div style="height: 10px"></div>
    <div class="submission-content-title">
        📄 {{ 'content' | translate }}:
    </div>
    <div class="submission-content">
        <p>{{ data.content }}</p>
    </div>

    <mat-form-field appearance="fill">
        <mat-label>⭐ {{ 'score' | translate }}</mat-label>
        <input matInput formControlName="score" type="number" min="0" max="20"/>
        <mat-error *ngIf="submissionForm.get('score')?.hasError('max')">
            {{ 'scoreRangeError' | translate }}
        </mat-error>
    </mat-form-field>

    <div class="button-group">
        <button mat-raised-button color="primary" type="submit">✅ {{ 'save' | translate }}</button>
        <button mat-button color="warn" type="button" (click)="onCancel()">❌ {{ 'cancel' | translate }}</button>
    </div>

</form>
